# bun:test configuration. Drives `bun test` (the spike-era replacement
# for vitest — see CLAUDE.md "Test runner" section).
#
# NOTE: bun:test does NOT honour a `timeout` key in bunfig.toml (verified
# 2026-05-20 against bun 1.3.14 — bunfig's `[test]` section accepts
# preload / coverage / reporter / randomize etc. but no per-test
# timeout). The per-test timeout is set via the `--timeout 30000` CLI
# flag baked into the `test` / `test:watch` / `test:eval` / `test:fast`
# scripts in package.json. Setting it here is a silent no-op.
#
# 30000 (30s) matches the prior vitest config — many integration tests
# do tree-sitter parsing + sqlite work in real tempdirs and would
# spuriously time out under the default 5s on a loaded box.
[test]
# Nothing yet — preload / coverage / reporter all have sane defaults.
