# Spring Boot application config — language-coverage parity fixture.
# Exercises the `properties` extractor's full v1 surface:
#   - `key=value` and `key:value` separators (interchangeable)
#   - `#` and `!` comment markers
#   - leading whitespace around the separator
#   - escape sequences (\= / \: / \\) on the key side
