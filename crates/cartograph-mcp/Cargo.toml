[package]
name = "cartograph-mcp"
description = "Bounded JSON-RPC and MCP transport contracts for Cartograph v2"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.96.1"
authors = ["Adder Factory"]
license = "MIT"
repository = "https://github.com/adder-factory/cartograph"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt",
  "rt-multi-thread",
  "sync",
  "time",
] }

# This slice is intentionally buildable before it is wired into the root
# workspace. Remove this nested workspace declaration when the product adapter
# and root workspace membership land together.
[workspace]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
