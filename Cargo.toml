[workspace]
resolver = "3"
members = [
  "crates/cartograph-cli",
  "crates/cartograph-config",
  "crates/cartograph-db",
  "crates/cartograph-domain",
  "crates/cartograph-indexer",
]

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.96.1"
authors = ["Adder Factory"]
license = "MIT"
repository = "https://github.com/adder-factory/cartograph"

[workspace.dependencies]
blake3 = "1.8.5"
clap = { version = "4.6.4", features = ["derive"] }
getrandom = "0.4.3"
libc = "0.2.183"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sqlx-core = { version = "=0.9.0", default-features = false, features = [
  "_rt-tokio",
  "_tls-rustls-ring-native-roots",
] }
sqlx-postgres = { version = "=0.9.0", default-features = false }
thiserror = "2.0.19"
tempfile = "3.23.0"
tokio = { version = "1.53.1", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
