name: Standalone Release

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Replace assets if the release tag already exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Quality gate before we build/publish anything: the same checks CI runs
  # on every push (typecheck + biome/architecture + biomarker floor). A
  # release should never ship a tree that wouldn't pass CI.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run check
      - run: bun run check:biomarkers

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # Cover every target install.sh / install.ps1 can resolve. ARM
        # Linux/Windows runners may be unavailable on some plans; fail-fast
        # is off so a missing runner doesn't block the other targets, and
        # the installers fail-fast with a "build from source" hint when a
        # target's asset is absent.
        os:
          - ubuntu-latest # linux-x64
          - ubuntu-24.04-arm # linux-arm64
          - macos-latest # darwin-arm64
          - macos-13 # darwin-x64 (Intel)
          - windows-latest # win32-x64
          - windows-11-arm # win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:standalone
      - run: node scripts/smoke-standalone.mjs
      - uses: actions/upload-artifact@v4
        with:
          # Unique per matrix entry — two macOS / ubuntu / windows runners
          # share runner.os, which would collide and overwrite artifacts.
          name: standalone-${{ matrix.os }}
          # Only the finished archives, NOT the uncleaned stage directory.
          path: |
            release/cartograph-*.tar.gz
            release/cartograph-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Stage release assets
        run: |
          mkdir -p release
          # Only archives — never stray src/*.ts or a cross-OS-clobbered
          # raw binary that an over-broad `cartograph-*` glob would sweep up.
          find release-artifacts -type f \( -name 'cartograph-*.tar.gz' -o -name 'cartograph-*.zip' \) -exec cp {} release/ \;
          (cd release && sha256sum cartograph-* > SHA256SUMS)
          ls -lh release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$OVERWRITE" != "true" ]; then
              echo "Release $TAG already exists. Re-run with the 'overwrite' input to replace its assets, or bump the version." >&2
              exit 1
            fi
            gh release upload "$TAG" release/cartograph-* release/SHA256SUMS --clobber
          else
            # Tag the exact commit the artifacts were built from, not whatever
            # the default branch HEAD is at publish time.
            gh release create "$TAG" release/cartograph-* release/SHA256SUMS \
              --target "$GITHUB_SHA" --title "$TAG" --notes "Cartograph standalone bundles."
          fi
