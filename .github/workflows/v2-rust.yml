name: v2 Rust

on:
  workflow_call:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'crates/**'
      - 'deploy/paradedb/**'
      - 'deny.toml'
      - 'scripts/*rust-release*'
      - '.github/workflows/v2-rust.yml'
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - 'crates/**'
      - 'deploy/paradedb/**'
      - 'deny.toml'
      - 'scripts/*rust-release*'
      - '.github/workflows/v2-rust.yml'

permissions:
  contents: read

concurrency:
  group: v2-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format + clippy + unit + PostgreSQL-only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace

      - name: Dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.96.1'
          command: check
          arguments: --all-features

      - name: No SQLite production dependencies
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree --locked --workspace --all-features -e normal)"
          if grep -Eiq 'sqlite|libsqlite' <<<"$tree"; then
            echo 'Cartograph v2 must not contain a SQLite runtime dependency.' >&2
            grep -Ei 'sqlite|libsqlite' <<<"$tree" >&2
            exit 1
          fi
          if grep -Eq '^name = "(sqlx-sqlite|libsqlite3-sys|rusqlite)"$' Cargo.lock; then
            echo 'Cargo.lock contains a forbidden SQLite package.' >&2
            grep -E '^name = "(sqlx-sqlite|libsqlite3-sys|rusqlite)"$' Cargo.lock >&2
            exit 1
          fi
          echo 'No SQLite production dependency found.'

      - name: No SQLite runtime source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          matches="$(
            git grep -nI -E -i 'rusqlite|libsqlite|sqlx[-_:]?sqlite|bun:sqlite|sqlite3|sqlite://' -- \
              Cargo.toml \
              build.rs \
              ':(glob)crates/*/Cargo.toml' \
              ':(glob)crates/*/build.rs' \
              ':(glob)crates/*/src/**' \
              ':(glob)deploy/paradedb/**'
          )"
          grep_status=$?
          set -e
          if (( grep_status > 1 )); then
            echo "SQLite source scan failed with status $grep_status." >&2
            exit "$grep_status"
          fi
          unexpected=''
          while IFS=: read -r path line text; do
            if [[ -z "$path" ]]; then
              continue
            fi
            trimmed="${text#"${text%%[![:space:]]*}"}"
            trimmed="${trimmed%"${trimmed##*[![:space:]]}"}"

            # This exact URL is test-only rejection coverage, never a runtime adapter.
            if [[ "$path" == 'crates/cartograph-config/src/lib.rs' ]]; then
              case "$trimmed" in
                'let input = "sqlite:///tmp/private-cartograph.db?password=should-not-leak";')
                  continue
                  ;;
              esac
            fi

            unexpected+="$path:$line:$text"$'\n'
          done <<<"$matches"

          if [[ -n "$unexpected" ]]; then
            echo 'Cartograph v2 contains forbidden SQLite runtime source:' >&2
            printf '%s' "$unexpected" >&2
            exit 1
          fi
          echo 'No SQLite runtime source found.'

      - name: No executable TypeScript, Bun, Node, or browser-viewer runtime
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$({
            git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' '*.mts' '*.cts' '*.mjs' '*.cjs'
          } | grep -Ev '^(crates/cartograph-indexer/tests/fixtures/native_corpus_v1/|crates/cartograph-extract/tests/fixtures/v1_1_33/|docs/test-beds/)' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Cartograph v2 contains executable legacy runtime source outside frozen fixtures:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          for legacy in package.json package-lock.json bun.lock bunfig.toml tsconfig.json biome.json; do
            if git ls-files --error-unmatch "$legacy" >/dev/null 2>&1; then
              echo "Cartograph v2 still tracks legacy runtime manifest $legacy" >&2
              exit 1
            fi
          done
          if git ls-files 'src/**' '__tests__/**' 'bench/**' | grep -q .; then
            echo 'Cartograph v2 still tracks the executable v1 source/test/bench tree.' >&2
            git ls-files 'src/**' '__tests__/**' 'bench/**' >&2
            exit 1
          fi
          echo 'No executable TypeScript/Bun/Node/browser-viewer runtime found.'

  windows-portability:
    name: Windows strict compile portability
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Windows all-target, all-feature Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  paradedb:
    name: PostgreSQL 18 + ParadeDB + pgvector
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARTOGRAPH_POSTGRES_PASSWORD: cartograph-v2-ci-only
      CARTOGRAPH_DATABASE_URL: postgresql://cartograph:cartograph-v2-ci-only@127.0.0.1:55432/cartograph
      CARTOGRAPH_TEST_DATABASE_URL: postgresql://cartograph:cartograph-v2-ci-only@127.0.0.1:55432/cartograph
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Start pinned ParadeDB service on loopback
        id: start_paradedb
        run: >-
          docker run --detach
          --name cartograph-v2-ci-postgres
          --env POSTGRES_USER=cartograph
          --env POSTGRES_PASSWORD="$CARTOGRAPH_POSTGRES_PASSWORD"
          --env POSTGRES_DB=cartograph
          --publish 127.0.0.1:55432:5432
          --health-cmd 'pg_isready -U cartograph -d cartograph'
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
          paradedb/paradedb:0.23.5@sha256:c3efc689b6ebd2fb396d7f50d68735b2dcff3e03f3bf51a926258d942201da2d

      - name: Wait for PostgreSQL health
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' cartograph-v2-ci-postgres)"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy ]]; then
              docker logs --tail 200 cartograph-v2-ci-postgres >&2
              exit 1
            fi
            sleep 2
          done
          docker logs --tail 200 cartograph-v2-ci-postgres >&2
          echo 'Timed out waiting for ParadeDB health.' >&2
          exit 1

      - name: Initialize required extensions
        run: >-
          docker exec cartograph-v2-ci-postgres
          psql --username cartograph --dbname cartograph --set ON_ERROR_STOP=1
          --command 'CREATE EXTENSION IF NOT EXISTS pg_search;'
          --command 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Verify loopback-only publication
        shell: bash
        run: |
          set -euo pipefail
          published="$(docker port cartograph-v2-ci-postgres 5432/tcp)"
          if [[ "$published" != '127.0.0.1:55432' ]]; then
            echo "Expected loopback-only PostgreSQL, got: $published" >&2
            exit 1
          fi

      - name: Rust database doctor
        run: |
          cargo run --locked --quiet -p cartograph-cli -- doctor
          cargo run --locked --quiet -p cartograph-cli -- doctor --format json

      - name: Live capability integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_capabilities -- --ignored --nocapture

      - name: Generation-safe schema and BM25 integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_generation -- --ignored --nocapture

      - name: COPY ingestion and deterministic digest integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_ingest -- --ignored --nocapture

      - name: Project operation lease integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_leases -- --ignored --nocapture

      - name: Semantic model, pgvector, HNSW, readiness, and retention integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_semantic -- --include-ignored --nocapture --test-threads=1

      - name: V1 PostgreSQL import, rollback, resume, and retention integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_v1_import_retention -- --ignored --nocapture --test-threads=1

      - name: Project purge fencing and physical-relation cleanup integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db
          --test live_project_purge -- --ignored --nocapture --test-threads=1

      - name: Lease-owned indexer supervisor integration test
        run: >-
          cargo test --locked --quiet -p cartograph-indexer
          --test live_supervisor -- --ignored --nocapture --test-threads=1

      - name: Agent runtime index, hybrid retrieval, no-op, freshness, and review integration test
        run: >-
          cargo test --locked --quiet -p cartograph-agent
          --test live_project -- --ignored --nocapture --test-threads=1

      - name: Native CLI/MCP summary, role, graph, history, session, and watcher integration tests
        run: >-
          cargo test --locked --quiet -p cartograph-cli
          -- --ignored --nocapture --test-threads=1

      - name: Locked native patch-task evaluation and repeatability gate
        run: >-
          cargo test --locked --quiet -p cartograph-agent
          --test patch_task_evaluation -- --include-ignored --nocapture --test-threads=1

      - name: Frozen 1/2/4/8/16-worker determinism and scaling benchmark
        run: cargo bench --locked -p cartograph-indexer --bench index_scaling

      - name: Managed database lifecycle integration test
        run: >-
          cargo test --locked --quiet -p cartograph-db --lib
          managed::tests:: -- --ignored --nocapture --test-threads=1

      - name: Managed backup, restore, upgrade, rollback, and derived-index test
        run: >-
          cargo test --locked --quiet -p cartograph-db --lib
          managed::maintenance::tests:: -- --ignored --nocapture --test-threads=1

      - name: ParadeDB logs on failure
        if: failure()
        shell: bash
        run: |
          if docker inspect cartograph-v2-ci-postgres >/dev/null 2>&1; then
            docker logs --tail 200 cartograph-v2-ci-postgres
          fi

      - name: Stop ParadeDB service
        if: always()
        run: docker rm --force --volumes cartograph-v2-ci-postgres 2>/dev/null || true
