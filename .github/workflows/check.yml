# Required CI gate — portability + typecheck (tsgo) + architecture + biome lint/format + mock hygiene + serial leak canaries + biomarker floor.
#
# Runs on every push to `main` and every pull request. Fails the build on
# any CI script portability issue, any typecheck error, any architecture drift,
# any biome lint diagnostic, any unformatted file, any unguarded partial
# source-module mock, any module-cache leak caught by the serial canaries, OR
# any biomarker ERROR/WARNING finding (the project's 0-err/0-warn floor).
# The biomarker gate guards against structural-health drift: without it, CI
# would gate only typecheck + biome and biomarker findings could accumulate
# unnoticed.
#
# Still excludes `npm run test:fast` — the test suite has had intermittent
# Bun bus-errors during full-suite (parallel-shard) `bun test`. The leak
# canary and biomarker gate are serial processes, so they don't carry that
# parallel-shard risk; revisit adding the full test suite once the bus-error
# is diagnosed.
#
# Install path: `npm ci --ignore-scripts` (lockfile) for the native prebuilts
# (tsgo / biome). The biomarker gate additionally needs the Bun runtime (bun:sqlite
# + bun:ffi + the vendored wasm grammars to index the repo), and PostgreSQL
# storage tests run against a pgvector-enabled PostgreSQL service.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref — pushing twice quickly only
# spends one runner.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: portability + typecheck + architecture + lint + format + mock hygiene + leaks + biomarkers
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: cartograph
          POSTGRES_PASSWORD: cartograph
          POSTGRES_DB: cartograph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartograph -d cartograph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    # Bumped from 15 → 20: the leak canary adds a serial set of paired
    # bun:test runs, and the biomarker gate adds one structural index of the
    # whole repo (serial mode, ~tens of seconds on a 2-core runner).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      # Bun runtime for the biomarker gate (indexes via bun:sqlite + bun:ffi).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        # --ignore-scripts skips usearch's ~2min from-source C++
        # postinstall (a runtime-guarded vector accelerator the gates
        # never load) while keeping optional PLATFORM packages — tsgo and
        # biome ship their binaries as plain optional file deps that an
        # --omit=optional install would drop.
        run: npm ci --ignore-scripts

      - name: CI script portability
        run: npm run check:ci-portability

      - name: Typecheck (tsgo)
        run: npm run typecheck

      - name: Architecture + lint + format check
        run: npm run check

      - name: Test mock hygiene
        run: npm run test:mock-hygiene

      - name: PostgreSQL storage + pgvector smoke
        env:
          CARTOGRAPH_TEST_POSTGRES_URL: postgres://cartograph:cartograph@localhost:5432/cartograph
          CARTOGRAPH_TEST_PGVECTOR_URL: postgres://cartograph:cartograph@localhost:5432/cartograph
        run: npm run test:postgres

      - name: Module leak canaries
        run: npm run test:leaks

      # Curated serial pure-unit suite. The full parallel-shard suite is
      # still excluded (Bun bus-errors under parallel native-worker load),
      # but these deterministic, index-free, worker-free unit tests run
      # serially with no bus-error risk and catch functional regressions
      # that typecheck/biome/biomarkers miss. Expand incrementally.
      - name: Unit tests (serial subset)
        run: npm run test:ci-unit

      # Biomarker floor: 0 error / 0 warning. Indexes the repo structurally
      # (serial mode for determinism) and fails on any err/warn finding.
      - name: Biomarker floor (0 err / 0 warn)
        run: npm run check:biomarkers
