# Required CI gate — typecheck (tsgo) + biome lint/format + serial leak canaries + biomarker floor.
#
# Runs on every push to `main` and every pull request. Fails the build on
# any typecheck error, any biome lint diagnostic, any unformatted file,
# any module-cache leak caught by the serial canaries, OR any biomarker
# ERROR/WARNING finding (the project's 0-err/0-warn floor).
# The biomarker gate guards against structural-health drift: without it, CI
# would gate only typecheck + biome and biomarker findings could accumulate
# unnoticed.
#
# Still excludes `npm run test:fast` — the test suite has had intermittent
# Bun bus-errors during full-suite (parallel-shard) `bun test`. The leak
# canary and biomarker gate are serial processes, so they don't carry that
# parallel-shard risk; revisit adding the full test suite once the bus-error
# is diagnosed.
#
# Install path: `npm ci` (lockfile) for the native prebuilts (tsgo / biome /
# usearch). The biomarker gate additionally needs the Bun runtime (bun:sqlite
# + bun:ffi + the vendored wasm grammars to index the repo), so a Bun setup
# step is added; tsgo + biome themselves still run under node.
name: check

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref — pushing twice quickly only
# spends one runner.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck + lint + format + leaks + biomarkers
    runs-on: ubuntu-latest
    # Bumped from 15 → 20: the leak canary adds a serial set of paired
    # bun:test runs, and the biomarker gate adds one structural index of the
    # whole repo (serial mode, ~tens of seconds on a 2-core runner).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Bun runtime for the biomarker gate (indexes via bun:sqlite + bun:ffi).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsgo)
        run: npm run typecheck

      - name: Lint + format check (biome)
        run: npm run check

      - name: Module leak canaries
        run: npm run test:leaks

      # Biomarker floor: 0 error / 0 warning. Indexes the repo structurally
      # (serial mode for determinism) and fails on any err/warn finding.
      - name: Biomarker floor (0 err / 0 warn)
        run: npm run check:biomarkers
