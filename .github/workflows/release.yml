# Cartograph v2 release pipeline. Every published asset is a native Rust
# executable; PostgreSQL, ParadeDB, and pgvector are external runtime services
# and are never bundled in these archives.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/v2-rust.yml
    permissions:
      contents: read

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            asset_target: linux-x64
            shell: bash
          - os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            asset_target: linux-arm64
            shell: bash
          - os: macos-latest
            rust_target: aarch64-apple-darwin
            asset_target: darwin-arm64
            shell: bash
          - os: macos-latest
            rust_target: x86_64-apple-darwin
            asset_target: darwin-x64
            shell: bash
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            asset_target: windows-x64
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install release target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build, audit, and smoke Unix archive
        if: matrix.shell == 'bash'
        shell: bash
        run: scripts/build-rust-release.sh '${{ matrix.rust_target }}' '${{ matrix.asset_target }}'

      - name: Build, audit, and smoke Windows archive
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: scripts/build-rust-release.ps1 -Target '${{ matrix.rust_target }}' -AssetTarget '${{ matrix.asset_target }}'

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.asset_target }}
          path: release/cartograph-*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts

      - name: Stage and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find release-artifacts -type f -name 'cartograph-*' -exec cp {} release/ \;
          expected=$'cartograph-darwin-arm64\ncartograph-darwin-arm64.tar.gz\ncartograph-darwin-x64\ncartograph-darwin-x64.tar.gz\ncartograph-linux-arm64\ncartograph-linux-arm64.tar.gz\ncartograph-linux-x64\ncartograph-linux-x64.tar.gz\ncartograph-windows-x64.exe\ncartograph-windows-x64.zip'
          actual="$(find release -maxdepth 1 -type f -name 'cartograph-*' -exec basename {} \; | LC_ALL=C sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'release asset set mismatch' >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") >&2 || true
            exit 1
          fi
          (cd release && sha256sum cartograph-* > SHA256SUMS)
          ls -lh release

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cartograph-cli") | .version')"
          EXPECTED_TAG="v$VERSION"
          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "Release tag $TAG does not match Cargo version $EXPECTED_TAG" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
            echo "Release tag $TAG resolves to $TAG_SHA, but this workflow built $GITHUB_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$TAG_SHA" != "$MAIN_SHA" ]]; then
            echo "Release tag must point at the published main head ($MAIN_SHA), not $TAG_SHA" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$IS_DRAFT" != true ]]; then
              echo "Refusing to replace assets on published release $TAG" >&2
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --generate-notes --draft
          fi
          gh release upload "$TAG" release/cartograph-* release/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
