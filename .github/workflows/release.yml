# One release pipeline: native per-target builds (each artifact is built
# AND smoked on its own OS), gated on the same checks CI runs, published
# with SHA256SUMS. Consolidates the earlier cross-compile release.yml and
# the dispatch-only standalone-release.yml (2026-06-12).
#
# Triggers: pushing a v* tag publishes to that tag's release. A manual
# dispatch is a DRY RUN (gate + build + smoke only) unless `overwrite` is
# set, which (re)publishes the package.json-versioned release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Publish without a tag; replace assets if the release exists'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A release must never ship a tree that would not pass CI.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # --ignore-scripts skips usearch's ~2min from-source C++
      # postinstall (a runtime-guarded vector accelerator neither the
      # gates nor the standalone load) while keeping optional PLATFORM
      # packages — tsgo and biome ship their binaries as plain optional
      # file deps that an --omit=optional install would drop.
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run check
      - run: bun run check:biomarkers

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # One runner per published target — native compile + native smoke.
        # No windows-arm64 asset: bun has no compile runtime for it, and
        # install.ps1 points Windows-on-ARM at the x64 build (OS-level
        # emulation).
        os:
          - ubuntu-latest # linux-x64
          - ubuntu-24.04-arm # linux-arm64
          - macos-latest # darwin-arm64
          - macos-13 # darwin-x64 (Intel)
          - windows-latest # windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:standalone
      - run: node scripts/smoke-standalone.mjs
      - uses: actions/upload-artifact@v7
        with:
          # Unique per matrix entry so same-OS runners can't collide.
          name: standalone-${{ matrix.os }}
          # Only the finished archives, never the uncleaned stage dir.
          path: |
            release/cartograph-*.tar.gz
            release/cartograph-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.overwrite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Stage release assets
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name 'cartograph-*.tar.gz' -o -name 'cartograph-*.zip' \) -exec cp {} release/ \;
          (cd release && sha256sum cartograph-* > SHA256SUMS)
          ls -lh release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/cartograph-* release/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            # Tag the exact commit the artifacts were built from, not
            # whatever the default branch HEAD is at publish time.
            gh release create "$TAG" release/cartograph-* release/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
