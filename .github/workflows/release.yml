# One release pipeline: native per-target builds (each artifact is built
# AND smoked on its own OS), gated on the same checks CI runs, published
# with SHA256SUMS. Consolidates the earlier cross-compile release.yml and
# the dispatch-only standalone-release.yml (2026-06-12).
#
# Triggers: pushing a v* tag publishes to that tag's release. A manual
# dispatch is always a DRY RUN (gate + build + smoke only).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A release must never ship a tree that would not pass CI.
  gate:
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # One job per published target — native compile + native smoke,
        # except darwin-x64: GitHub retired hosted Intel macs (macos-13
        # queues forever), so the ARM mac runner cross-compiles it and
        # the smoke runs the x64 binary under Rosetta (installed on the
        # hosted ARM images; our x64 builds are bun-baseline, no AVX).
        # Windows is pinned to the image windows-latest redirects to by
        # 2026-06-15 so the migration happens on our terms.
        # No windows-arm64 asset: bun has no compile runtime for it, and
        # install.ps1 points Windows-on-ARM at the x64 build (OS-level
        # emulation).
        include:
          - os: ubuntu-latest # linux-x64
          - os: ubuntu-24.04-arm # linux-arm64
          - os: macos-latest # darwin-arm64
          - os: macos-latest # darwin-x64 cross-compiled, Rosetta smoke
            target: darwin-x64
          - os: windows-2025-vs2026 # windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: ./.github/actions/bun-install
      - run: bun run build:standalone ${{ matrix.target }}
      - run: node scripts/smoke-standalone.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Unique per matrix entry so same-OS runners can't collide.
          name: standalone-${{ matrix.os }}-${{ matrix.target || 'host' }}
          # Only the finished archives, never the uncleaned stage dir.
          path: |
            release/cartograph-*.tar.gz
            release/cartograph-*.zip
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: release-artifacts
      - name: Stage release assets
        run: |
          mkdir -p release
          find release-artifacts -type f \( -name 'cartograph-*.tar.gz' -o -name 'cartograph-*.zip' \) -exec cp {} release/ \;
          (cd release && sha256sum cartograph-* > SHA256SUMS)
          ls -lh release
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-checksums: release/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          EXPECTED_TAG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED_TAG" ]; then
            echo "Release tag $TAG does not match package.json version $EXPECTED_TAG" >&2
            exit 1
          fi
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Release tag $TAG resolves to $TAG_SHA, but this workflow built $GITHUB_SHA" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Refusing to replace assets on published release $TAG; publish a new patch version instead." >&2
              exit 1
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$TAG" --generate-notes --draft
          fi
          # Retries may replace assets while the release is still a draft.
          # Once published, repository release immutability prevents changes.
          gh release upload "$TAG" release/cartograph-* release/SHA256SUMS \
            --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
