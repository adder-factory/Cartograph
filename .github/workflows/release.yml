# Release pipeline: build the standalone tarballs/zip for every target,
# smoke what each runner can execute, and attach assets + SHA256SUMS to
# the GitHub release for the pushed tag.
#
# `workflow_dispatch` runs build + smoke only (publish is tag-gated) —
# use it as a dry run before cutting a tag.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

env:
  BUN_VERSION: 1.3.14

jobs:
  build-unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Build cross-compiled tarballs
        run: |
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun scripts/build-standalone.mjs "$t"
          done
      - name: Smoke linux-x64 (native on this runner)
        run: |
          mkdir -p /tmp/smoke
          tar -xzf release/cartograph-linux-x64.tar.gz -C /tmp/smoke --strip-components=1
          test "$(/tmp/smoke/bin/cartograph --version)" = "$(jq -r .version package.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: unix-tarballs
          path: release/cartograph-*.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/build-standalone.mjs win32-x64
      - name: Smoke win32-x64
        shell: pwsh
        run: |
          Expand-Archive release/cartograph-win32-x64.zip -DestinationPath C:\smoke
          $v = & C:\smoke\cartograph-win32-x64\bin\cartograph.cmd --version
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          if ("$v".Trim() -ne $expected) { throw "version mismatch: got '$v', expected '$expected'" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/cartograph-win32-x64.zip
          if-no-files-found: error

  publish:
    needs: [build-unix, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd assets
          sha256sum cartograph-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create release if missing, upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" assets/* --clobber --repo "$GITHUB_REPOSITORY"
