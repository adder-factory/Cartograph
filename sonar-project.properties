sonar.projectKey=cartograph
sonar.projectName=cartograph
sonar.sources=src
sonar.tests=__tests__
# Python is present only in the extraction fixtures, whose contract targets the
# macOS/system-compatible Python 3.9 syntax accepted by the parser.
sonar.python.version=3.9
# `src/features/viewer/static/**` holds the bundled viewer UI assets (vendored
# HTML/JS/CSS served same-origin from the local viewer process) — out of the
# first-party-source analysis scope. Excluding it keeps the gate on core source;
# SRI (S5725) is not meaningful for same-origin local assets.
sonar.exclusions=node_modules/**,.cartograph/**,.scannerwork/**,coverage/**,src/features/viewer/static/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bun's LCOV only tracks the current test process. CLI command tests exercise
# these surfaces through spawned `bun src/bin/cartograph.ts ...` subprocesses,
# so their executed lines are not represented in coverage/lcov.info.
# The shared MCP daemon is also integration-tested through spawned proxy/child
# processes (`__tests__/mcp-daemon.test.ts`), which LCOV cannot attribute back
# to the parent test process.
# PostgreSQL SQL execution runs in a Worker thread (`src/db/postgres-worker.ts`);
# live PostgreSQL tests exercise it, but Bun LCOV does not attribute Worker
# thread execution back to the parent coverage process.
sonar.coverage.exclusions=src/bin/**,src/installer/llm-setup-plan.ts,src/mcp/daemon.ts,src/mcp/tools/admin.ts,src/mcp/tools/review.ts,src/db/sqlite-table-options.ts,src/db/postgres-worker.ts
