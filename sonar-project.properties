sonar.projectKey=cartograph
sonar.projectName=cartograph
sonar.sources=src
sonar.tests=__tests__
sonar.exclusions=node_modules/**,.cartograph/**,.scannerwork/**,coverage/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bun's LCOV only tracks the current test process. CLI command tests exercise
# these surfaces through spawned `bun src/bin/cartograph.ts ...` subprocesses,
# so their executed lines are not represented in coverage/lcov.info.
sonar.coverage.exclusions=src/bin/**,src/installer/llm-setup-plan.ts,src/mcp/tools/admin.ts,src/mcp/tools/review.ts,src/db/sqlite-table-options.ts
